schema: clay.case/v1
id: case_analoggym_bandgap
title: AnalogGym dual-output CMOS voltage reference
category: reference
maturity: L2_COMPILE
source:
  clay: source/design.clay
  top_cell: DualOutputSubthresholdVref
  upstream_clay: examples/analoggym_bandgap_benchmark.clay
metadata:
  pdk: sky130
  family: voltage_reference
  analoggym_category: Voltage Reference
  design_intent:
    - Use a self-biased PMOS mirror chain to establish the reference current.
    - Use regular-NMOS and LVT-NMOS devices as a dual-Vth reference core.
    - Keep both reference outputs explicit; the cell is not forced into an opamp-like port shape.
    - Declare cold/room/hot temperature points so the package is ready for Vref-vs-temperature verification.
  external_references:
    - https://www.analog.com/en/resources/technical-articles/selecting-the-optimum-voltage-reference.html
    - https://www.mdpi.com/2674-0729/4/1/5
criteria:
  structural:
    mos_devices: 7
    output_caps: 2
    required_device_classes:
      - pmos
      - nmos
      - nmos_lvt
    required_outputs:
      - vref1
      - vref2
    required_temps_c:
      - -40
      - 27
      - 85
  simulation_contract:
    vref_plausible_range_v:
      op: "inside"
      min: -0.1
      max: 1.9
    temperature_response:
      op: "differs_by_more_than"
      target_v: 0.000001
artifacts:
  - evidence/design_intent.md
verify:
  commands:
    fast:
      - python -m clay case validate .
      - python -m pytest ../../../tests/test_analoggym_bandgap_benchmark.py -q
obligations:
  required:
    - parse
    - compile
    - reference_architecture
    - temperature_sweep_contract
gaps:
  - Declared lowered from L3_SIM to L2_COMPILE; the verify command runs a live ngspice temperature sweep via pytest but persists no measured sim-results json on disk, so evidence-computed maturity stops at L2. Bundle a measured sim json (Vref-vs-temperature points) to restore L3_SIM.
  - The current source validates Clay infrastructure and topology; it does not yet prove a production bandgap TC target.
  - The self-biased core can settle near the zero-current state without a dedicated startup circuit.
  - PVT, PSRR, layout, PEX, and signoff evidence are still needed before L4/L5.
